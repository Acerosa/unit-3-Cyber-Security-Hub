<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="API-driven Unit 3 formative activity.">
  <meta name="theme-color" content="#0b1f33">
  <link rel="icon" href="data:,">
  <title>Activity | Unit 3 Cyber Security Hub</title>
  <script src="../js/core/theme-bootstrap.js?v=2"></script>
</head>
<body data-page="week1-activity" data-section="week-1" data-root=".." data-view="week1-activity" data-activity="activity-api" data-activity-id="U3-W01-COMMAND-WORDS">
  <noscript><p>JavaScript is required for the Unit 3 Cyber Security Hub.</p></noscript>
  <div id="root"></div>
  <template id="unit3-page-body"><section id="ae-loading" class="panel ae-loading" aria-labelledby="ae-loading-heading">
      <h2 id="ae-loading-heading">Loading activity</h2>
      <p role="status" aria-live="polite">Checking the activity service and loading content.</p>
    </section>

    <section id="ae-error" class="panel ae-error" aria-labelledby="ae-error-heading" hidden>
      <h2 id="ae-error-heading">Activity unavailable</h2>
      <div id="ae-error-messages" class="status-messages" aria-live="assertive" aria-atomic="true"></div>
      <p><a href="../week-1/">Return to Week 1</a></p>
    </section>

    <div id="ae-main" hidden>
      <section class="panel" aria-labelledby="ae-meta-heading">
        <h2 id="ae-meta-heading">Activity details</h2>
        <div id="ae-metadata"></div>
        <div id="ae-progress" aria-live="polite"></div>
      </section>

      <div id="ae-sections"></div>

      <section id="ae-final-panel" class="panel ae-final-panel" aria-labelledby="ae-final-heading" hidden>
        <h2 id="ae-final-heading">Submit your result</h2>
        <p class="panel-note">
          Complete your details after every assessment section has been checked.
          This pilot submits in TEST mode only.
        </p>
        <div id="ae-learner-host"></div>
        <div id="ae-learner-errors" class="status-messages" aria-live="polite"></div>

        <div class="field">
          <label for="ae-most-difficult">Which question did you find most difficult? <span class="optional">(optional)</span></label>
          <select id="ae-most-difficult" name="mostDifficultItem">
            <option value="">None</option>
          </select>
        </div>

        <div class="field">
          <label for="ae-reflection">Reflection <span class="optional">(optional)</span></label>
          <textarea id="ae-reflection" name="reflection" rows="4" maxlength="500"></textarea>
        </div>

        <div class="ae-submit-actions">
          <button type="button" id="ae-btn-submit" class="btn btn-primary">Submit TEST result</button>
          <button type="button" id="ae-btn-start-another" class="btn btn-secondary" hidden>Start another attempt</button>
        </div>
        <div id="ae-submit-status" class="status-messages" aria-live="polite" aria-atomic="true"></div>
      </section>

      <section id="ae-result-panel" class="panel" aria-labelledby="ae-result-heading" hidden>
        <h2 id="ae-result-heading">Submission summary</h2>
        <div id="ae-result-summary"></div>
      </section>
    </div></template>
  <script type="module" src="../src/main.tsx"></script>
</body>
</html>
