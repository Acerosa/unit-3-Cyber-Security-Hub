  <template id="unit3-page-body"><section class="panel" aria-labelledby="w4-outcomes-heading">
      <h2 id="w4-outcomes-heading">Weekly learning outcomes</h2>
      <ul class="section-list">
        <li>Identify and explain the range of motivations that drive cyber attackers.</li>
        <li>Describe the four categories of target for cyber security threats: people, organisations, equipment and information.</li>
        <li>Explain the methods that can be used during an attack on people, organisations, equipment and information.</li>
        <li>Analyse how the motivation of an attacker influences the target selected and the method used.</li>
      </ul>
      <p class="w4-formula" role="note">Motivation = why · Target = what · Method = how</p>
    </section>
    <section class="panel" aria-labelledby="w4-exam-heading">
      <h2 id="w4-exam-heading">Examination focus</h2>
      <ul class="section-list">
        <li>Read the question stem carefully so you answer for motivation when motivation is asked.</li>
        <li>Do not use a method as an answer to a motivation question.</li>
        <li>Recognise <strong>analyse</strong> as a command word that requires stated connections.</li>
        <li>Use connective phrasing to make analytical connections visible.</li>
        <li>Sustain one case throughout an extended response.</li>
        <li>Manage time on higher-tariff questions so the final connection is written.</li>
      </ul>
    </section>
