<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in or create a learner account for Unit 3 Cyber Security Hub formative submissions.">
  <meta name="theme-color" content="#0b1f33">
  <link rel="icon" href="data:,">
  <title>Account | Unit 3 Cyber Security Hub</title>
  <script src="../js/core/theme-bootstrap.js?v=2"></script>
</head>
<body data-page="account" data-section="account" data-root=".." data-view="account">
  <noscript><p>JavaScript is required for the Unit 3 Cyber Security Hub.</p></noscript>
  <div id="root"></div>
  <template id="unit3-page-body"><section class="panel unit3-account" aria-labelledby="account-forms-heading">
      <h2 id="account-forms-heading" class="visually-hidden">Sign in or register</h2>
      <div class="unit3-account__tabs" role="tablist" aria-label="Account actions">
        <button type="button" class="unit3-account__tab is-active" role="tab" id="tab-signin" aria-controls="panel-signin" aria-selected="true">Sign in</button>
        <button type="button" class="unit3-account__tab" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false">Create account</button>
      </div>

      <div id="panel-signin" class="unit3-account__panel" role="tabpanel" aria-labelledby="tab-signin">
        <p class="unit3-account__note">Use the email and password for your learner account.</p>
        <form id="signin-form" class="unit3-account__form" novalidate>
          <div class="field">
            <label for="signin-email">Email</label>
            <input type="email" id="signin-email" name="email" autocomplete="email" required aria-required="true">
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" name="password" autocomplete="current-password" required aria-required="true">
          </div>
          <p id="signin-error" class="unit3-account__error" role="alert" aria-live="assertive"></p>
          <div class="unit3-account__actions">
            <button type="submit" class="btn btn-primary" id="signin-submit">Sign in</button>
          </div>
        </form>
      </div>

      <div id="panel-register" class="unit3-account__panel" role="tabpanel" aria-labelledby="tab-register" hidden>
        <h3>Create learner account</h3>
        <p id="register-step" class="unit3-account__step" role="status" aria-live="polite">Step 1 of 2 — Account details</p>
        <form id="register-form" class="unit3-account__form" novalidate>
          <fieldset id="register-profile-fields" class="unit3-account__fieldset">
            <legend>Personal details</legend>
            <div class="field">
              <label for="register-first-name">First name</label>
              <input type="text" id="register-first-name" name="firstName" autocomplete="given-name" required aria-required="true" maxlength="100">
            </div>
            <div class="field">
              <label for="register-surname">Surname</label>
              <input type="text" id="register-surname" name="surname" autocomplete="family-name" required aria-required="true" maxlength="100">
            </div>
            <div class="field">
              <label for="register-student-number">Student ID</label>
              <input type="text" id="register-student-number" name="studentNumber" inputmode="text" autocomplete="off" required aria-required="true" maxlength="100">
            </div>
          </fieldset>
          <fieldset id="register-account-fields" class="unit3-account__fieldset">
            <legend>Account details</legend>
            <div class="field">
              <label for="register-email">College email address</label>
              <input type="email" id="register-email" name="email" autocomplete="email" required aria-required="true">
            </div>
            <div class="field">
              <label for="register-password">Password</label>
              <input type="password" id="register-password" name="password" autocomplete="new-password" required aria-required="true" minlength="8">
            </div>
            <div class="field">
              <label for="register-password-confirm">Confirm password</label>
              <input type="password" id="register-password-confirm" name="passwordConfirm" autocomplete="new-password" required aria-required="true" minlength="8">
            </div>
          </fieldset>
          <fieldset id="register-option-fields" class="unit3-account__fieldset" hidden>
            <legend>Course details</legend>
            <div class="field">
              <label for="register-option">Year / Group</label>
              <select id="register-option" name="registrationOption" required aria-required="true" disabled>
                <option value="">Loading available choices…</option>
              </select>
            </div>
          </fieldset>
          <p id="register-error" class="unit3-account__error" role="alert" aria-live="assertive"></p>
          <div class="unit3-account__actions">
            <button type="submit" class="btn btn-primary" id="register-submit">Continue</button>
          </div>
        </form>
      </div>
    </section></template>
  <script type="module" src="../src/main.tsx"></script>
</body>
</html>
