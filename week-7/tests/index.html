<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 7 registry tests</title>
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
  <main class="site-main" id="main-content">
    <h1>Week 7 registry tests</h1>
    <div id="results" class="panel" aria-live="polite"></div>
    <p><a href="../">Back to Week 7</a></p>
  </main>
  <script src="../../js/course-context.js"></script>
  <script src="../../js/activity-engine-config.js"></script>
  <script src="../../js/week6-progress.js"></script>
  <script src="../../js/week7-progress.js"></script>
  <script src="../data/session1-retrieval.js"></script>
  <script src="../data/risk-management-learning.js"></script>
  <script src="../data/risk-register.js"></script>
  <script src="../data/testing-methods.js"></script>
  <script src="../data/sandbox-observation.js"></script>
  <script src="../data/detection-prevention.js"></script>
  <script src="../data/heightened-threat.js"></script>
  <script src="../data/session2-retrieval.js"></script>
  <script src="../data/testing-matching.js"></script>
  <script src="../data/recommendation-practice.js"></script>
  <script src="../data/ocr-practice.js"></script>
  <script src="../data/answer-improvement.js"></script>
  <script src="../data/directed-study.js"></script>
  <script src="../data/support-challenge.js"></script>
  <script src="validate-registry.js"></script>
  <script>
    (function () {
      var host = document.getElementById('results');
      var results = window.Unit3Week7Tests.runWeek7RegistryTests();
      var failed = results.filter(function (r) { return !r.ok; });
      var heading = document.createElement('p');
      heading.textContent =
        failed.length === 0
          ? 'All ' + results.length + ' checks passed.'
          : failed.length + ' of ' + results.length + ' checks failed.';
      host.appendChild(heading);
      var list = document.createElement('ul');
      results.forEach(function (r) {
        var li = document.createElement('li');
        li.textContent = (r.ok ? 'PASS' : 'FAIL') + ': ' + r.name + (r.detail ? ' - ' + r.detail : '');
        list.appendChild(li);
      });
      host.appendChild(list);
      if (failed.length) {
        console.error('Week 7 registry failures', failed);
      } else {
        console.log('Week 7 registry checks passed', results.length);
      }
    })();
  </script>
</body>
</html>
