  <template id="unit3-page-body"><section class="panel" aria-labelledby="w5-outcomes-heading">
      <h2 id="w5-outcomes-heading">Weekly learning outcomes</h2>
      <ul class="section-list">
        <li>Explain why cyber security is a global problem affecting individuals, organisations and states.</li>
        <li>Recognise common vulnerability patterns in supplied, fictional examples.</li>
        <li>Distinguish vulnerability, threat and risk, and recommend an appropriate control.</li>
        <li>Improve insecure implementations using a secure alternative.</li>
        <li>Identify and describe impacts relating to loss, disruption and safety.</li>
        <li>Explain how a single incident affects different stakeholders in different ways.</li>
        <li>Analyse the impacts of a cyber security incident using evidence from a scenario.</li>
      </ul>
      <p class="w5-formula" role="note">Impacts = Loss · Disruption · Safety — not financial loss alone</p>
    </section>
    <section class="panel" aria-labelledby="w5-exam-heading">
      <h2 id="w5-exam-heading">Examination focus</h2>
      <ul class="section-list">
        <li>Cover <strong>loss</strong>, <strong>disruption</strong> and <strong>safety</strong> when a question asks for impacts.</li>
        <li>Name the stakeholder affected.</li>
        <li>Distinguish immediate and longer-term consequences.</li>
        <li>Use scenario evidence to support each claimed impact.</li>
        <li>Avoid importing facts from unrelated incidents.</li>
      </ul>
    </section>
    <section class="panel" aria-labelledby="w5-sessions-heading">

      <ul class="section-list">

        <li><strong>Session 2:</strong> Retrieval quiz, stakeholder impact grid, analytical writing, defensive controls, secure rewrites, OCR-style questions and answer improvement.</li>
      </ul>
