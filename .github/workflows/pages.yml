name: GitHub Pages

on:
  push:
    branches:
      - unit-3-Cyber-Security-Hub
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Unit 3 hub
        uses: actions/checkout@v7
        with:
          path: unit-3-Cyber-Security-Hub
          fetch-depth: 0

      - name: Check out reviewed Core
        uses: actions/checkout@v7
        with:
          repository: Acerosa/learning-platform-core
          ref: v0.2.3
          path: learning-platform-core

      - name: Check out reviewed Content
        uses: actions/checkout@v7
        with:
          repository: Acerosa/learning-platform-content
          ref: v0.1.2
          path: learning-platform-content

      - name: Check out reviewed UI
        uses: actions/checkout@v7
        with:
          repository: Acerosa/Acerosa-learning-platform-ui
          ref: v0.1.7
          path: learning-platform-ui

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            unit-3-Cyber-Security-Hub/package-lock.json
            learning-platform-ui/package-lock.json

      - name: Verify reviewed Core ships curriculum-runtime
        run: test -f learning-platform-core/dist/curriculum-runtime.esm.js

      - name: Install shared UI peer dependencies
        working-directory: learning-platform-ui
        run: npm ci

      - name: Install, test and build
        working-directory: unit-3-Cyber-Security-Hub
        run: |
          npm ci
          npm test

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/unit-3-Cyber-Security-Hub' || github.ref == 'refs/heads/main')
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/unit-3-Cyber-Security-Hub' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v5
        with:
          path: unit-3-Cyber-Security-Hub/dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/unit-3-Cyber-Security-Hub' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
